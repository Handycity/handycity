name: Sync Phone-Expert Data

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Optional source URL or path for phone-expert data"
        required: false
        type: string
  # Schedule suspended pending the decision on the scraped price dataset this
  # job imports (see docs/CODE_REVIEW.md section 2.1). Still runnable via the
  # Actions UI. Uncomment to resume at a monthly cadence -- the source data
  # changes slowly and every run rewrites the whole price table.
  # schedule:
  #   - cron: '0 5 1 * *' # monthly, 1st at 05:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Vienna
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: sync
        env:
          PHONE_EXPERT_SOURCE: ${{ github.event.inputs.source }}
        run: |
          if [ -n "${PHONE_EXPERT_SOURCE}" ]; then
            export PHONE_EXPERT_SOURCE="${PHONE_EXPERT_SOURCE}"
          fi
          npm run owner:sync:phone-expert
          # Fold the import into calculator.prices. The page no longer merges it
          # at render time, so without this the sync would change nothing.
          npm run prices:normalize
          npm run content:validate
          ASTRO_TELEMETRY_DISABLED=1 PUBLIC_SITE_BASE=/ npm run build
          npm run assets:validate

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/phone-expert src/data/content
          git commit -m "chore: sync phone-expert data"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
