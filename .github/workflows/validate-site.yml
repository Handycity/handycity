name: Validate Site Content

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:validate
      # Every workflow that pushes to main must be wired into deploy.yml,
      # or its commits land without ever being published.
      - run: npm run workflows:validate
      # Type-checks .astro frontmatter against the schema-derived content types.
      - run: npm run check
      # Fails if the phone-expert import has entries not yet folded into the
      # content store, so unvalidated prices can never reach a customer.
      - run: npm run prices:check
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          PUBLIC_SITE_BASE: /
      # Runs after the build: it verifies every asset the built pages actually
      # reference, rather than a hand-maintained list that can drift.
      - run: npm run assets:validate
